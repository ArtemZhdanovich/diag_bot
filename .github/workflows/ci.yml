name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: 123:test
      ADMIN_IDS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Mypy check
        run: uv run mypy app

  test:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: 123:test
      ADMIN_IDS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest -q

  migrations:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: 123:test
      ADMIN_IDS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Apply migrations to fresh DB
        run: uv run alembic upgrade head

      - name: Check models match schema
        run: uv run alembic check
